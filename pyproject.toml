[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ENoise"
version = "1.0.1"
description = "一个轻量级柏林噪声库，支持 Python 3.6.5+"
readme = "README.md"
requires-python = ">=3.6.5"
license = { text = "MIT" }
authors = [
    { name = "Minecraft-and-pocket-world-mango", email = "2929547146@qq.com" }
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.16"]
fast = ["numpy>=1.16"]

[project.urls]
Homepage = "https://github.com/Minecraft-and-pocket-world-mango/ENoise"
Repository = "https://github.com/Minecraft-and-pocket-world-mango/ENoise"